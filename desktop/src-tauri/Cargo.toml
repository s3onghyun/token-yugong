[package]
name = "token-yugong-desktop"
version = "0.1.0"
description = "Experimental Linux and Windows shell for Token Yugong"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
yugong-core = { path = "../core" }

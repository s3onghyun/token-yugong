name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    env:
      # macos-15 includes this full Xcode; do not mix its newer Testing.framework
      # with the Command Line Tools compiler selected by the image by default.
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Build release executable
        run: swift build -c release --product TokenPet
      - name: Run unit tests
        env:
          TOKENPET_PREFS: dev.yugongpet.ci
        run: ./test.sh

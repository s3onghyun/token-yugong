name: Desktop beta

on:
  pull_request:
  push:
    branches: [fm/yugong-desktop-port]

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-24.04
            bundles: appimage,deb
            artifact: token-yugong-linux-beta
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
            artifact: token-yugong-windows-beta
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d6d6cb6c70d5f2a8d31c7e5bd5b # v4.0.4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend tooling
        run: npm ci --prefix desktop
      - name: Test portable usage core
        run: cargo test --manifest-path desktop/core/Cargo.toml
      - name: Build unsigned installers
        run: npm run tauri --prefix desktop -- build --bundles ${{ matrix.bundles }}
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: ${{ matrix.artifact }}
          path: desktop/target/release/bundle/
          if-no-files-found: error
